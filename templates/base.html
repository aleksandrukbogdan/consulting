<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ScienceDevice - Твой проводник в мир науки{% endblock %}</title>
    <!-- Подключаем шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Подключаем наш CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Шапка сайта -->
    <header class="header sticky">
      <nav class="nav container">
        <a href="/" class="logo">
          <img src="{{ url_for('static', filename='images/logo_glass.png') }}" alt="ScienceDevice - профессиональные анализаторы" class="logo-image" />
        </a>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav-item"><a href="/" class="nav-link">Главная</a></li>
            <li class="nav-item nav-item--dropdown">
              <a href="/#education" class="nav-link">Образование <span class="material-symbols-outlined">expand_more</span></a>
              <ul class="dropdown-menu">
                <li><a href="/#education">Для школы и вузов</a></li>
                <li><a href="/#professionals">Для лабораторий</a></li>
              </ul>
            </li>
            <li class="nav-item"><a href="/#specs1" class="nav-link">О продукте</a></li>
            <li class="nav-item"><a href="/#research" class="nav-link">Публикации</a></li>
            <li class="nav-item"><a href="/#contacts" class="nav-link">Контакты</a></li>
          </ul>
           <button class="icon-btn nav__close" id="nav-close" aria-label="Закрыть меню">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="header__actions">
          <button class="icon-btn theme-toggle-btn" id="theme-toggle-desktop" aria-label="Переключить тему">
            <span class="material-symbols-outlined">light_mode</span>
          </button>
          <a href="#contacts" class="btn btn--primary header__cta">Отправить запрос</a>
          <button class="icon-btn nav__toggle" id="nav-toggle" aria-label="Открыть меню">
            <span class="material-symbols-outlined">menu</span>
          </button>
        </div>
      </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал сайта -->
    <footer class="footer">
      <div class="container">
        <p>© БИОТЕХКОНВЕРСИЯ. Все права защищены.</p>
        <a href="/admin" style="font-size: 12px; color: #777; text-decoration: none; float: right;">Admin</a>
      </div>
    </footer>

    <!-- Подключаем JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
